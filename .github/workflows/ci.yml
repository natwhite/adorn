# CI for adorn (GAP-4).
#
# Deliberately minimal: install, format, lint, typecheck, build, test. There is finally a real suite
# (524 tests across 20 suites) for this to protect, which is what made CI worth adding.
#
# Ordering note: the steps run cheapest-and-most-specific first, so a failure names its own
# cause. `typecheck` covers `index.ts`, `src/`, `test/` AND `examples/` (via tsconfig.test.json),
# whereas `build` compiles only what ships to `dist/` — they are not redundant, and a demo or
# test that stops compiling is caught by the first while the published output is proven by the
# second.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch cancels the previous run rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version, not just the first — a break on one Node major is
      # useful information even when another is already red.
      fail-fast: false
      matrix:
        # 20 and 22 are Active LTS / Maintenance; 24 is the current line. The floor is 20.19
        # rather than plain 20 because some transitive lint tooling declares that engine range.
        node-version: ['20.19', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` (not `npm install`) — installs strictly from package-lock.json and fails if
      # the lockfile and package.json have drifted, which is exactly what CI should catch.
      - name: Install dependencies
        run: npm ci

      # rxjs was removed outright by GAP-6, along with `@Memoize` — the only decorator that ever
      # needed it. It is no longer a dependency, a devDependency, or an optional peer, so nothing
      # in the tree may resolve it. This step is the inverse of the one it replaces: it used to
      # assert rxjs was reachable, and now guards against it coming back, because a transitive
      # reintroduction would restore the dependency weight GAP-6 exists to have shed without any
      # test noticing.
      - name: Verify rxjs is absent (GAP-6)
        run: node -e "try { require.resolve('rxjs'); console.error('rxjs resolved - it must not be a dependency'); process.exit(1) } catch { console.log('rxjs absent, as intended') }"

      # Cheapest and most specific, so it runs first. Prettier is the sole authority on layout;
      # `.prettierignore` records what is deliberately kept out of its reach (all Markdown) and
      # `// prettier-ignore` marks the few places in `index.ts` where hand-grouping carries meaning.
      # This step is what stops formatting drifting again — it was kept out of CI until the tree
      # was actually clean, which it now is.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The demo is the one artifact that exercises the library end-to-end the way a consumer
      # would: decorate a class, call it, watch enforcement fire. It asserts its own outcome
      # (non-zero exit if a constraint violation is NOT raised), so it is a genuine smoke test
      # of installation rather than just a script that happens to run.
      - name: Demo smoke test (enforcement actually fires)
        run: npm run demo
